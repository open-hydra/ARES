name: Build and test

# One build of ARES with gfortran, OpenMP + MPI, RELEASE, then its CI tests (ctest -L ci: test/CMakeLists.txt), each a
# run of one process without mpirun. The validation cases of test/ are run locally (docs/development/testing.md).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - authors.md
      - .mailmap
      - CITATION.cff
      - LICENSE
      - scripts/**
  # A merge queue for main waits for the required checks on each merge group, and GitHub Actions starts a workflow
  # for a merge group only on this event.
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

# The jobs read the repository and write nothing to GitHub: a read-only token.
permissions:
  contents: read

jobs:
  build:
    name: gfortran, OpenMP + MPI, RELEASE
    # A named Ubuntu release, not ubuntu-latest, which GitHub moves to newer releases: the release of the job
    # changes only with this line.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The submodule of ARES (FiNeR), without recursion. The configure fetches FiNeR's libraries and the releases
          # of ORION, OSLO and FLINT over https (cmake/SemVerDeps.cmake), without their submodules: Cantera (whose
          # submodule Eigen is hosted on gitlab.com) and SUNDIALS are built only with USE_CANTERA=ON or
          # USE_SUNDIALS=ON.
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUSE_OPENMP=ON \
            -DUSE_MPI=ON \
            -DUSE_TECIO=OFF \
            -DUSE_SUNDIALS=OFF \
            -DUSE_CANTERA=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Check the executables
        # The build writes them to bin/ of the source tree, whatever the build directory
        run: test -x bin/ARES && test -x bin/DocGen

      - name: Test
        # The cases of test/CMakeLists.txt, side by side; each prints its checks
        run: ctest --test-dir build -L ci --output-on-failure -j $(nproc)
