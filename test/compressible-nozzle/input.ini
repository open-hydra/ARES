; NICFD nozzle: siloxane MDM vapour through the planar TROVA M1.5 nozzle, test M1.5H of
; Spinelli et al., Exp. Fluids 59:126 (2018) (reference/), as the SU2 tutorial NICFD_nozzle.
; Total inlet state p0 = 904388 Pa, T0 = 542.13 K (Z0 = 0.65), supersonic exit at M = 1.5.
; Planar 2D (one cell in z, symmetry on the k faces): the upper half of the nozzle, the axis a symmetry line.

[ARES-Parameters]
iter-threshold = 40000
newrun = .true.

[ARES-Physics]
equations  = navier-stokes
turbulence = SST

[ARES-Numerics]
cfl                   = 0.6
vnn                   = 0.5
time-scheme           = RK3
time-accurate         = false
integration-variables = prim
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[ARES-IO]
sol-diter = 10000
shell-diter = 500

; MDM: CoolProp Helmholtz EOS (gas phase imposed), SU2 constant mu and k: see custom.py.
; Tables cover the expansion p0 -> exit (286 kPa) with margin; their high-p, low-h corner is metastable vapour.
[GPB-Phase1]
type = real-fluid
name = MDM
fluid = MDM
thermo = custom
pmin = 1.0e5
pmax = 1.3e6
Tmin = 500.0
Tmax = 570.0
NP = 300
NH = 300

; Quasi-1D isentropic solution (make_ic.py): subsonic to the throat, supersonic past it.
; Turbulence: 2% intensity at the inlet speed (k = 0.118 m2/s2), mut/mu = 10, times the inlet density 71.9 kg/m3.
[ICB-Block1]
p-file = IC/p.dat
p-direction = x
T-file = IC/T.dat
T-direction = x
vel-file = IC/u.dat
vel-direction = x
rhoK = 8.45
rhoOmega = 5.0e6

[BCB-Block1]
face1 = inflow
face2 = exit
face3 = symmetry
face4 = adiabatic
face5 = symmetry
face6 = symmetry

; Mass flux + static temperature (BC 404, ARES has no total-pressure inlet): the choked mass flux of the
; isentropic nozzle from (p0, T0) over the inlet-to-throat area ratio 0.036 / 0.0084 (make_ic.py).
[inflow]
type = inlet
g = 1006.41
T = 541.925
k = 0.118
omega = 7.0e4

; Supersonic exit
[exit]
type = extrapolation

[symmetry]
type = symmetry

[adiabatic]
type = wall
q = 0.0
