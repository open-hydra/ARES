; Real-fluid table of the CO2 shock tube (ATLAS GPB, CoolProp): 4.5-10.5 MPa, the states of the exact solution
; (5-10 MPa, 330-360 K) with a margin. Regenerate with ./make_tables.sh (needs ATLAS and CoolProp); the tables are
; committed so the test needs neither.
[GPB-Phase1]
type = real-fluid
name = CO2
fluid = CO2
pmin = 4.5e6
pmax = 10.5e6
Tmin = 300.0
Tmax = 400.0
NP = 60
NH = 60
